## Distribution compose file used by the desktop installers (installer/windows,
## installer/macos) and anyone who'd rather pull prebuilt images than build
## locally. Unlike docker-compose.yml (which builds api/web from ./apps/*),
## this pulls published images from GHCR — the installers ship this file
## instead of the full source tree, so there's no local build step at all.
##
## Images are built and pushed by .github/workflows/docker-publish.yml on
## every version tag. Override the tag with IMAGE_TAG (defaults to "latest").
services:
  # db and qdrant are "profiles" — opt out of either (or both) with
  # COMPOSE_PROFILES in .env (scripts/setup.sh writes this for you) or
  # `docker compose --profile ... up` on the command line, and point
  # DATABASE_URL/QDRANT_URL at your own external instance instead. Default
  # COMPOSE_PROFILES=db,qdrant in .env.example starts both, matching the
  # all-bundled behavior this file always had.
  db:
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novel}
      POSTGRES_USER: ${POSTGRES_USER:-novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novel} -d ${POSTGRES_DB:-novel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ghcr.io/${GHCR_OWNER:-itanaka66}/ine-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://novel:novel@db:5432/novel}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      CONTROLLER_OLLAMA_URL: ${CONTROLLER_OLLAMA_URL:-http://host.docker.internal:11434}
      CONTROLLER_OLLAMA_MODEL: ${CONTROLLER_OLLAMA_MODEL:-qwen3:14b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env before running}
      NOVEL_STORAGE_DIR: /novel_storage
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:-}
      GIT_AUTOSYNC_INTERVAL_SECONDS: ${GIT_AUTOSYNC_INTERVAL_SECONDS:-300}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
    volumes:
      - novel_storage:/novel_storage
      - backups:/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: ghcr.io/${GHCR_OWNER:-itanaka66}/ine-web:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  novel_storage:
  backups:
