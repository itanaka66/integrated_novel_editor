<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>INE</title>
  <link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./ine-frame.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="./icon.svg" alt="" />
      <span>Integrated Novel Editor</span>
    </div>
    <span id="conn" class="dot off" title="Disconnected"></span>
  </header>
  <main>
    <p id="status" class="status">Connecting…</p>
    <div class="row">
      <button id="refresh" class="primary" type="button">Load works</button>
      <button id="ask" type="button">Ask coach</button>
    </div>
    <label class="card">
      <h2>Work</h2>
      <select id="projects" disabled>
        <option value="">—</option>
      </select>
    </label>
    <section class="card">
      <h2>Story twin</h2>
      <p id="health" class="health">—</p>
      <div class="metrics">
        <div class="metric"><b id="m-ep">–</b><span>Episodes</span></div>
        <div class="metric"><b id="m-ch">–</b><span>Characters</span></div>
        <div class="metric"><b id="m-iss">–</b><span>Open issues</span></div>
      </div>
    </section>
    <section class="card">
      <h2>Recent episodes</h2>
      <ul id="episodes" class="list">
        <li class="muted">Load a work to see episodes.</li>
      </ul>
    </section>
  </main>
  <footer>Anna App · talks to your local INE API</footer>
  <script src="anna-tool-ids.js"></script>
  <script type="module" src="./app.js"></script>
<iframe
    id="ine-main-frame"
    title="Integrated Novel Editor"
    src="http://localhost:3000/"
    sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
