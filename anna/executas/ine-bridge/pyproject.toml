[project]
name = "tool-dev-ine-bridge"
version = "0.2.5"
description = "INE Bridge — Executa stdio tool plugin for the Integrated Novel Editor Anna App"
requires-python = ">=3.10"
authors = [{ name = "INE" }]
license = { text = "GPL-3.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
"tool-dev-ine-bridge" = "ine_plugin:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ine_plugin"]
