upstream ine_web {
    server web:3000;
}

upstream ine_api {
    server api:8000;
}

# HTTP: ACME challenge only, redirect everything else
server {
    listen 80;
    server_name neomedia.dynv6.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:6544$request_uri;
    }
}

# HTTPS Web — port 6544 → web:3000
server {
    listen 6544 ssl;
    http2 on;
    server_name neomedia.dynv6.net;

    ssl_certificate     /etc/letsencrypt/live/neomedia.dynv6.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neomedia.dynv6.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://ine_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket / SSE support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# HTTPS API — port 6556 → api:8000
server {
    listen 6556 ssl;
    http2 on;
    server_name neomedia.dynv6.net;

    ssl_certificate     /etc/letsencrypt/live/neomedia.dynv6.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neomedia.dynv6.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://ine_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
