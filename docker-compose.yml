services:
  # db and qdrant are "profiles" — opt out of either (or both) with
  # COMPOSE_PROFILES in .env (scripts/setup.sh writes this for you) or
  # `docker compose --profile ... up` on the command line, and point
  # DATABASE_URL/QDRANT_URL at your own external instance instead. Default
  # COMPOSE_PROFILES=db,qdrant in .env.example starts both, matching the
  # all-bundled behavior this file always had.
  db:
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novel}
      POSTGRES_USER: ${POSTGRES_USER:-novel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novel} -d ${POSTGRES_DB:-novel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "6544:6544"
      - "6556:6556"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - api
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://novel:novel@neomedia.dynv6.net:6555/novel?sslmode=require}
      QDRANT_URL: ${QDRANT_URL:-https://neomedia.dynv6.net:6554}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      CONTROLLER_OLLAMA_URL: ${CONTROLLER_OLLAMA_URL:-http://host.docker.internal:11434}
      CONTROLLER_OLLAMA_MODEL: ${CONTROLLER_OLLAMA_MODEL:-qwen3:14b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      CONTROLLER_OLLAMA_API_KEY: ${CONTROLLER_OLLAMA_API_KEY:-}
      ANNA_LLM_URL: ${ANNA_LLM_URL:-}
      ANNA_LLM_API_KEY: ${ANNA_LLM_API_KEY:-}
      ANNA_LLM_MODEL: ${ANNA_LLM_MODEL:-}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://neomedia.dynv6.net:6544}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env before running}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-https://neomedia.dynv6.net:6556}
      OAUTH_LOGIN_REDIRECT_URL: ${OAUTH_LOGIN_REDIRECT_URL:-https://neomedia.dynv6.net:6544}
      NOVEL_STORAGE_DIR: /novel_storage
      COVERS_DIR: /covers
      COVER_CONFIG_PATH: /covers/cover_config.json
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-}
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:-}
      GIT_AUTOSYNC_INTERVAL_SECONDS: ${GIT_AUTOSYNC_INTERVAL_SECONDS:-300}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - novel_storage:/novel_storage
      - covers:/covers
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_started
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://neomedia.dynv6.net:6556/api/v1}
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  novel_storage:
  covers:
  backups:
  certbot_webroot:
  certbot_certs:

networks:
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.20.0.0/16"
        - subnet: "fd00::/80"
