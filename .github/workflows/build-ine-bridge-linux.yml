name: Build INE Bridge Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Linux binary
        shell: bash
        run: |
          bash anna/executas/ine-bridge/package_binary.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ine-bridge-linux-x86_64
          path: |
            anna/executas/ine-bridge/dist-anna/*.tar.gz
            anna/executas/ine-bridge/dist-anna/*.sha256
