name: Build INE Bridge Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build Linux binary
        shell: bash
        run: |
          bash anna/executas/ine-bridge/package_binary.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ine-bridge-linux-x86_64
          path: |
            anna/executas/ine-bridge/dist-anna/*.tar.gz
            anna/executas/ine-bridge/dist-anna/*.sha256
