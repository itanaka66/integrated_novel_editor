name: Build INE Bridge Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.4)'
        required: true
        default: '0.1.4'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            ext: ''
            archive: tar.gz
          - platform: darwin-x86_64
            runner: macos-13
            ext: ''
            archive: tar.gz
          - platform: linux-x86_64
            runner: ubuntu-latest
            ext: ''
            archive: tar.gz
          - platform: windows-x86_64
            runner: windows-latest
            ext: .exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone binary
        shell: bash
        run: |
          pyinstaller --onefile \
            --name integrated-novel-editor-ine-bridge \
            anna/executas/ine-bridge/ine_plugin.py

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="integrated-novel-editor-ine-bridge-${{ github.event.inputs.version }}-${{ matrix.platform }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist integrated-novel-editor-ine-bridge
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: powershell
        run: |
          $version = "${{ github.event.inputs.version }}"
          $platform = "${{ matrix.platform }}"
          $archive = "integrated-novel-editor-ine-bridge-${version}-${platform}.zip"
          Compress-Archive `
            -Path "dist\integrated-novel-editor-ine-bridge.exe" `
            -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ine-bridge-${{ matrix.platform }}
          path: |
            integrated-novel-editor-ine-bridge-${{ github.event.inputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error
