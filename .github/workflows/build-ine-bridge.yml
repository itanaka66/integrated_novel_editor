name: Build INE Bridge Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.14)'
        required: true
        default: '0.2.14'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            archive: tar.gz
          - platform: darwin-x86_64
            runner: macos-13
            archive: tar.gz
          - platform: linux-x86_64
            runner: ubuntu-latest
            archive: tar.gz
          - platform: windows-x86_64
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller && pip install anna/executas/ine-bridge/

      - name: Build standalone binary
        shell: bash
        run: |
          pyinstaller --onefile \
            --name integrated-novel-editor-ine-bridge \
            anna/executas/ine-bridge/_launcher.py

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="integrated-novel-editor-ine-bridge-${{ inputs.version }}-${{ matrix.platform }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist integrated-novel-editor-ine-bridge
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version  = "${{ inputs.version }}"
          $platform = "${{ matrix.platform }}"
          $archive  = "integrated-novel-editor-ine-bridge-${version}-${platform}.zip"
          Compress-Archive -Path "dist\integrated-novel-editor-ine-bridge.exe" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "${archive}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ine-bridge-${{ matrix.platform }}
          path: |
            integrated-novel-editor-ine-bridge-${{ inputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error
