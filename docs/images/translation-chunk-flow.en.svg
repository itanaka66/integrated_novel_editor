<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1000" height="760" fill="#ffffff"/><rect x="40" y="20" width="440" height="46" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="47.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Chunk</text><rect x="40" y="90" width="440" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="114.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Translate prompt</text><text x="260.0" y="131.0" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">(language, names, rules)</text><rect x="40" y="185" width="440" height="50" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="214.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Translation LLM (the episode's pinned LLM)</text><rect x="40" y="280" width="440" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="306.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Clean the answer</text><text x="260.0" y="321.0" text-anchor="middle" font-size="11" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">remove &lt;think&gt;, code fence, "Here is the translation:", trailing notes</text><rect x="40" y="380" width="440" height="60" rx="8" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="406.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Rule check</text><text x="260.0" y="422.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">too short? still in the source language?</text><rect x="40" y="485" width="440" height="60" rx="8" fill="#ede9fe" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="511.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Omission check</text><text x="260.0" y="526.0" text-anchor="middle" font-size="11" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">embed sentences (bge-m3): a source sentence with no counterpart?</text><rect x="40" y="590" width="440" height="60" rx="8" fill="#fce7f3" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="616.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Optional LLM review (Controller, TRANSLATION_REVIEW=true)</text><text x="260.0" y="631.0" text-anchor="middle" font-size="11" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">issues? → re-translate with the findings</text><rect x="40" y="690" width="440" height="46" rx="8" fill="#d1fae5" stroke="#475569" stroke-width="1.2"/><text x="260.0" y="717.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Translated chunk</text><line x1="260.0" y1="66" x2="260.0" y2="90" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="260.0" y1="136" x2="260.0" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="260.0" y1="235" x2="260.0" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="260.0" y1="340" x2="260.0" y2="380" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="260.0" y1="440" x2="260.0" y2="485" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="260.0" y1="545" x2="260.0" y2="590" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="260.0" y1="655" x2="260.0" y2="690" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="268.0" y="470" text-anchor="start" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">ok</text><text x="268.0" y="575" text-anchor="start" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">ok</text><rect x="560" y="360" width="380" height="66" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="1.2"/><text x="750.0" y="389.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Retry once with a firmer prompt</text><text x="750.0" y="405.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">keep the better answer</text><line x1="480" y1="410" x2="560" y2="395" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="520.0" y="396.5" text-anchor="middle" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">bad</text><line x1="750" y1="426" x2="480" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="560" y="470" width="380" height="66" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="1.2"/><text x="750.0" y="499.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Re-translate naming the missing sentences</text><text x="750.0" y="515.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">keep only if more sentences come back</text><line x1="480" y1="515" x2="560" y2="503" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="520.0" y="503.0" text-anchor="middle" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">missing</text><line x1="750" y1="536" x2="480" y2="620" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="560" y="610" text-anchor="start" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Each step falls back to the previous answer if it does not improve it.</text><text x="40" y="14" text-anchor="start" font-size="12" font-weight="700" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">One chunk (≈2500 characters) of an episode</text></svg>