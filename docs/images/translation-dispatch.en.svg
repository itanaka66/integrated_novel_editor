<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><rect x="330" y="20" width="340" height="60" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/><text x="500.0" y="46.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Translation LLM list (Settings)</text><text x="500.0" y="62.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">each row: URL · model · ✓ enabled · ✓ languages</text><rect x="330" y="110" width="340" height="40" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="500.0" y="134.5" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">1. enabled rows only</text><rect x="330" y="180" width="340" height="40" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="500.0" y="204.5" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">2. rows that have the target language checked</text><rect x="330" y="250" width="340" height="40" rx="8" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/><text x="500.0" y="274.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">none left?</text><rect x="30" y="250" width="220" height="40" rx="8" fill="#fce7f3" stroke="#475569" stroke-width="1.2"/><text x="140.0" y="274.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Controller translates</text><rect x="330" y="320" width="340" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="500.0" y="344.0" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">3. pick the least busy LLM</text><text x="500.0" y="361.0" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">(ties: round-robin)</text><rect x="330" y="406" width="340" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="500.0" y="430.0" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">4. pin it to the episode</text><text x="500.0" y="447.0" text-anchor="middle" font-size="13" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">counted busy until the episode is done</text><line x1="500" y1="80" x2="500" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="150" x2="500" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="220" x2="500" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="290" x2="500" y2="320" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="376" x2="500" y2="406" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="330" y1="270" x2="250" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="290.0" y="264.0" text-anchor="middle" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">yes</text><text x="508" y="312" text-anchor="start" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">no</text><rect x="720" y="330" width="250" height="70" rx="8" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/><text x="845.0" y="361.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Episodes run in groups of N</text><text x="845.0" y="377.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">(N = LLMs for that language)</text><line x1="670" y1="434" x2="760" y2="405" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="845" y1="400" x2="845" y2="430" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><rect x="720" y="430" width="250" height="34" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/><text x="845.0" y="451.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Episode 1 → LLM A</text><rect x="720" y="474" width="250" height="34" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/><text x="845.0" y="495.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Episode 2 → LLM B</text><rect x="720" y="518" width="250" height="34" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/><text x="845.0" y="539.0" text-anchor="middle" font-size="12" fill="#0f172a" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">Episode 3 → LLM C</text><text x="30" y="450" text-anchor="start" font-size="11" fill="#334155" font-family="Meiryo,'Yu Gothic','Noto Sans CJK JP','Segoe UI',Arial,sans-serif">A one-episode work uses one LLM. Chunks of an episode run one after another on its LLM.</text></svg>