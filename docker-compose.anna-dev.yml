services:
  anna-dev:
    build:
      context: .
      dockerfile: integrated_novel_editor/anna/Dockerfile.dev
    working_dir: /workspace/anna
    volumes:
      - ./integrated_novel_editor/anna:/workspace/anna
      - anna_app_home:/root/.anna-app
      - anna_cli_credentials:/root/.config/anna
    ports:
      - "5180:5180"
    environment:
      INE_BASE_URL: http://host.docker.internal:8000
      INE_USERNAME: ${ADMIN_USERNAME:-admin}
      INE_PASSWORD: ${ADMIN_PASSWORD:-novel-studio-change-me}
    restart: unless-stopped

volumes:
  anna_app_home:
  anna_cli_credentials: